/* ============================================================
   Base.vn — NEW app UI design language ("Base 3.0" app mocks)
   Extracted verbatim from Agentic_OS_Recap.html (#ocss, the summit site's own
   stylesheet), rules scoped to .mk-* app-window mocks. Do not hand-edit values;
   add product-specific rules in a separate layer.
   Fonts: --font-body "Inter Variable" (embed woff2-variations: vietnamese,
   latin-ext, latin subsets); mono = ui-monospace, Consolas, monospace.
   ============================================================ */
:root{
  --font-body:"Inter Variable","Segoe UI",system-ui,sans-serif;
  --font-mono:ui-monospace,Consolas,monospace;
}
.mk-window { --mk-ink: #111827; --mk-text: #1F2937; --mk-muted: #6B7280; --mk-dim: #9CA3AF; --mk-line: #E5E7EB; --mk-line-soft: #F3F4F6; --mk-bg: #FFFFFF; --mk-bg-soft: #F9FAFB; --mk-blue: #2563EB; --mk-blue-soft: #DBEAFE; --mk-blue-ink: #1D4ED8; --mk-orange: #F59E0B; --mk-orange-soft: #FFF7ED; --mk-red: #DC2626; --mk-red-soft: #FEE2E2; --mk-green: #16A34A; --mk-green-soft: #DCFCE7; --mk-cyan: #0891B2; --mk-cyan-soft: #ECFEFF; --mk-violet: #7C3AED; color-scheme: light; position: relative; background: var(--mk-bg); color: var(--mk-text); font-family: var(--font-body); font-size: 13px; line-height: 1.35; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.16); box-shadow: rgba(0, 0, 0, 0.75) 0px 50px 140px -30px, rgba(3, 10, 31, 0.8) 0px 20px 50px -20px, rgba(3, 10, 31, 0.6) 0px 0px 0px 1px; overflow: hidden; user-select: none; }
.mk-window * { box-sizing: border-box; }
.mk-window p { margin: 0px; }
.mk-window strong { color: var(--mk-ink); font-weight: 600; }
.mk-window svg { flex-shrink: 0; }
.mk-chrome { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: rgb(243, 244, 246); border-bottom: 1px solid var(--mk-line); }
.mk-chrome i { width: 11px; height: 11px; border-radius: 50%; display: block; }
.mk-chrome .url { margin-left: 10px; flex: 1 1 0%; display: flex; align-items: center; gap: 8px; height: 26px; padding: 0px 10px; background: rgb(255, 255, 255); border: 1px solid var(--mk-line); border-radius: 7px; font-size: 11.5px; color: var(--mk-muted); }
.mk-chrome .url b { color: var(--mk-ink); font-weight: 600; }
.mk-app { display: flex; align-items: stretch; background: var(--mk-bg); }
.mk-topbar { display: flex; align-items: center; gap: 14px; height: 48px; padding: 0px 16px; border-bottom: 1px solid var(--mk-line); }
.mk-topbar .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; color: var(--mk-ink); }
.mk-topbar .brand i { width: 22px; height: 22px; display: grid; place-items: center; color: var(--mk-blue); }
.mk-topbar .brand i svg { width: 22px; height: 22px; }
.mk-topbar .search { margin: 0px auto; display: flex; align-items: center; gap: 8px; width: 360px; height: 30px; padding: 0px 10px; border: 1px solid var(--mk-line); border-radius: 7px; background: var(--mk-bg-soft); color: var(--mk-muted); font-size: 12.5px; }
.mk-topbar .search kbd { margin-left: auto; font-size: 10px; padding: 1px 5px; border: 1px solid var(--mk-line); border-radius: 4px; color: var(--mk-dim); background: rgb(255, 255, 255); }
.mk-topbar .icons { display: flex; align-items: center; gap: 14px; color: var(--mk-muted); }
.mk-topbar .badge99 { position: relative; }
.mk-topbar .badge99 b { position: absolute; top: -7px; right: -12px; background: var(--mk-red); color: rgb(255, 255, 255); font-size: 9px; font-weight: 700; padding: 1px 4px; border-radius: 8px; }
.mk-topbar .me { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, rgb(203, 213, 225), rgb(71, 85, 105)); }
.mk-side { width: 198px; padding: 12px 10px; border-right: 1px solid var(--mk-line); display: grid; align-content: start; gap: 2px; }
.mk-side .title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: var(--mk-ink); padding: 4px 8px 12px; }
.mk-side .row { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0px 9px; border-radius: 7px; font-size: 13px; color: var(--mk-text); white-space: nowrap; overflow: hidden; }
.mk-side .row.on { background: var(--mk-blue); color: rgb(255, 255, 255); font-weight: 600; }
.mk-side .row .ltr { width: 17px; height: 17px; border-radius: 4px; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: rgb(255, 255, 255); }
.mk-side .row .chev { margin-left: auto; color: var(--mk-dim); }
.mk-side .sec { display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; color: var(--mk-muted); padding: 14px 9px 4px; }
.mk-main { flex: 1 1 0%; min-width: 0px; display: flex; flex-direction: column; }
.mk-head { display: flex; align-items: center; gap: 6px; height: 52px; padding: 0px 16px; border-bottom: 1px solid var(--mk-line); }
.mk-head .crumb { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--mk-ink); font-size: 14px; }
.mk-head .crumb .sep { color: var(--mk-dim); }
.mk-btn { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0px 12px; border-radius: 7px; background: var(--mk-blue); color: rgb(255, 255, 255); font-weight: 600; font-size: 13px; }
.mk-btn .split { margin-left: 4px; padding-left: 8px; border-left: 1px solid rgba(255, 255, 255, 0.35); display: inline-flex; }
.mk-btn.ghost { background: rgb(255, 255, 255); color: var(--mk-text); border: 1px solid var(--mk-line); }
.mk-pill { display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0px 7px; border-radius: 5px; font-size: 11px; font-weight: 600; }
.mk-pill.critical { background: var(--mk-red-soft); color: var(--mk-red); }
.mk-pill.high { background: rgb(255, 237, 213); color: rgb(194, 65, 12); }
.mk-pill.medium { background: var(--mk-blue-soft); color: var(--mk-blue-ink); }
.mk-pill.low { background: var(--mk-line-soft); color: var(--mk-muted); }
.mk-pill.overdue { background: var(--mk-red-soft); color: var(--mk-red); }
.mk-pill.green { background: var(--mk-green-soft); color: rgb(21, 128, 61); }
.mk-pill.cyan { background: var(--mk-cyan-soft); color: var(--mk-cyan); }
.mk-pill.grey { background: var(--mk-line-soft); color: rgb(75, 85, 99); }
.mk-pill.violet { background: rgb(237, 233, 254); color: rgb(109, 40, 217); }
.mk-av { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9px; font-weight: 700; color: rgb(255, 255, 255); box-shadow: rgba(255, 255, 255, 0.3) 0px 1px inset; }
.mk-window .mk-av.mk-av.mk-av { color: rgb(255, 255, 255); display: inline-grid; line-height: 1; font-weight: 700; }
.mk-av.sq { border-radius: 4px; font-size: 8px; }
.mk-pf { min-height: 920px; background: var(--mk-bg); color: var(--mk-text); font-size: 13px; }
.mk-pf .mk-app { min-height: 872px; align-items: stretch; }
.mk-pf .mk-side { display: flex; flex-direction: column; gap: 2px; }
.mk-pf .mk-side .title { white-space: nowrap; overflow: hidden; }
.mk-pf-sidefoot { margin-top: auto; display: grid; gap: 2px; padding-top: 12px; border-top: 1px solid var(--mk-line-soft); }
.mk-pf-rail .tile { font-size: 10px; }
.mk-pf-quick { display: inline-flex; align-items: center; gap: 8px; width: 240px; height: 32px; padding: 0px 12px; border: 1px solid var(--mk-line); border-radius: 8px; color: var(--mk-muted); font-size: 12.5px; }
.mk-pf-kpis { margin-left: 8px; color: var(--mk-muted); font-size: 13px; white-space: nowrap; }
.mk-pf-kpis b { color: var(--mk-ink); }
.mk-pf .mk-head > .mk-pf-quick { margin-left: auto; }
.mk-pf .mk-head > .mk-pf-quick ~ .mk-btn { margin-left: 0px; }
.mk-pill.ok { background: var(--mk-green-soft); color: rgb(21, 128, 61); }
.mk-pf-board { flex: 1 1 0%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 14px 16px 24px; background: var(--mk-bg-soft); overflow: hidden; align-content: start; }
.mk-pf-col { display: grid; gap: 10px; align-content: start; min-width: 0px; }
.mk-pf-stage { display: grid; gap: 4px; padding: 4px 0px 8px 12px; border-left: 3px solid var(--c); }
.mk-pf-stage .nm { display: flex; align-items: center; gap: 8px; min-width: 0px; }

:root{--pg:#E9EDF2;color-scheme:light}
html,body{background:var(--pg)}
body{margin:0;font-family:var(--font-body);-webkit-font-smoothing:antialiased;padding-inline:16px}
.wrap{padding-block:16px;display:flex;justify-content:center}

  border:1px solid #D5DBE3;box-shadow:0 30px 70px -34px rgba(15,23,42,.45),0 2px 6px rgba(15,23,42,.06)}
.mk-window code,.mono{font-family:var(--font-mono)}

/* motion */
.anim .rv{opacity:0;animation:rv .45s ease-out forwards}
@keyframes rv{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ring circle.pg{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.3,1)}
.stepi{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:9;pointer-events:none;font:600 11px/1 var(--font-body);color:#fff;background:rgba(15,23,42,.38);padding:4px 9px;border-radius:999px;letter-spacing:.02em;transition:opacity .4s}
.stepi.fade{opacity:0;transition:opacity .8s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.anim .rv{opacity:1!important}}

/* ===== Trang trình chiếu: sân khấu 1440×990 thu phóng theo màn hình · bìa → mở đầu từng phần → màn hình app · nền xanh đêm, chữ Lexend + Plus Jakarta Sans ===== */
:root{--bg:#070a1a;--bg2:#0b1024;--ink:#f3f5ff;--soft:#b9c0e4;--dim:#7983aa;--line:#ffffff1f;--brand:#0C2CB3;--brand-hi:#5B7CFF;--pink:#FF5C9D;
  --lex:Lexend,-apple-system,"Segoe UI",Arial,sans-serif;--jak:'Plus Jakarta Sans',Lexend,Arial,sans-serif;color-scheme:dark}
html,body{height:100%;background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--lex);-webkit-font-smoothing:antialiased;overflow:hidden;padding:0}
.deck{height:100%;display:grid;place-items:center;overflow:hidden;padding-inline:16px;background:radial-gradient(1200px 700px at 50% -10%,#16224f 0%,var(--bg) 62%)}
.fitbox{position:relative;flex:none}
.stage{position:absolute;left:0;top:0;width:1440px;height:990px;transform-origin:0 0;cursor:pointer;user-select:none}
.dtop{height:50px;display:flex;align-items:center;gap:12px;padding:0 4px;font-size:14px;color:var(--soft)}

.dtop>*{flex:none;white-space:nowrap}.dtop .sp{flex:1 1 auto}
.part{white-space:nowrap}
.dtop .lg{width:30px;height:30px;border-radius:8px;display:block}
.dtop b{font-family:var(--jak);font-weight:700;color:var(--ink);font-size:15px}
.dtop .parts{margin-left:26px;display:flex;gap:8px}
.part{font:inherit;cursor:pointer;height:30px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--soft);font-size:13px;font-weight:500;transition:background .3s,color .3s,border-color .3s}
.part.on{background:var(--brand);border-color:var(--brand-hi);color:#fff}
.part:focus-visible,.nv:focus-visible{outline:2px solid var(--brand-hi);outline-offset:2px}
.dtop .dnav{margin-left:auto;display:flex;align-items:center;gap:10px}
.nv{font:inherit;cursor:pointer;width:32px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--soft);display:grid;place-items:center}
.nv:disabled{opacity:.35;cursor:default}
.pos{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:50px;text-align:center}
.prog{position:absolute;left:0;right:0;top:48px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand-hi),var(--pink));transition:width .6s cubic-bezier(.22,.8,.3,1)}
.view{position:absolute;left:0;right:0;top:54px;height:936px;transition:opacity .2s ease,transform .2s ease}
.view.out{opacity:0;transform:translateY(-14px) scale(.992)}
.view.in .mkv{animation:vin .6s cubic-bezier(.22,.8,.3,1) both}
.view.in .capb{animation:rise .55s cubic-bezier(.22,.8,.3,1) .18s both}
@keyframes vin{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
.mkv{position:absolute;left:0;top:0;width:1440px;height:880px;border-radius:16px;overflow:hidden;background:var(--bg2);box-shadow:0 40px 90px -40px #000c}
.mkv .mk-window.cv{border:0;box-shadow:none;border-radius:16px}
.capb{position:absolute;left:0;right:0;top:880px;height:56px;display:flex;align-items:center;gap:12px;padding:0 6px;font-size:14.5px;color:var(--soft)}
.capb img{width:26px;height:26px;border-radius:6px;display:block}
.capb b{font-family:var(--jak);font-weight:700;font-size:16.5px;color:var(--ink);white-space:nowrap}
.capb i{width:1px;height:18px;background:var(--line)}
.nar{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 110px 40px}
.nar.anim .a{animation:rise .62s cubic-bezier(.22,.8,.3,1) both}
.nar h1,.nar h2{font-family:var(--jak);font-weight:800;margin:0;text-wrap:balance}
.nar h1{font-size:58px;letter-spacing:-1.6px;line-height:1.16}
.nar h2{font-size:43px;letter-spacing:-1px;line-height:1.2;margin-top:10px}
.nar .eye{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--pink)}
.cover{align-items:center;text-align:center}
.cover .lk{display:flex;align-items:center;gap:26px;margin-bottom:44px}
.cover .lk img{width:112px;height:112px;border-radius:26px;display:block;box-shadow:0 20px 50px -20px #000}
.cover .lk span{width:1px;height:46px;background:#ffffff38}
.cover .lk .bs{display:flex;align-items:center;gap:10px;font-family:var(--jak);font-weight:800;font-size:28px;color:#fff}
.cover .lk .bs svg{width:38px;height:38px;color:var(--brand-hi)}
.cover p{font-size:19px;color:var(--soft);margin:22px 0 0;line-height:1.55}
.cover .p3{display:flex;gap:12px;margin-top:38px}
.cover .p3 span{padding:10px 20px;border-radius:999px;border:1px solid var(--line);font-size:15px;color:var(--ink);background:#ffffff0a}
.cover small{margin-top:54px;font-size:12.5px;color:var(--dim)}
.steps5{display:grid;gap:12px 44px;margin-top:36px}
.steps5 div{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.steps5 img{width:36px;height:36px;border-radius:9px;display:block;flex:none}
.steps5 b{display:block;font-family:var(--jak);font-size:17.5px;font-weight:700;color:var(--ink)}
.steps5 small{display:block;font-size:13.5px;color:#93a0cc;margin-top:3px}
@media (prefers-reduced-motion:reduce){.view,.view.in .mkv,.view.in .capb,.nar.anim .a{animation:none!important;transition:none!important}}
.wrap{padding:0;display:block}
.s1 .ws img,.rail .wsl{width:24px;height:24px;border-radius:6px;display:block}
.rail .wsl{width:28px;height:28px;margin-top:4px}

function sTimesheet() {

  const anomaly = (e) => DAYS.some(x => { const p = pointOf(e, x); return p && (p.t === 'p' || p.t === 'n'); });
  const cell = (e, x) => {
    const p = pointOf(e, x), cls = [0, 6].includes(dow(x)) ? 'we' : '';

  };

      <span class="rr">Giờ làm <b>${SUM.worked.toLocaleString('vi-VN')}h</b></span><span>Tăng ca <b>${SUM.ot}h</b></span><span class="neg">Chênh lệch <b>${varPct.toLocaleString('vi-VN', { maximumFractionDigits: 1 })}%</b></span></div>
    <div class="gridw card ts ${d(1)}"><div class="gsc"><div class="mg" style="${cols}">${head}${rows}</div></div>
      <div class="foot">Hiển thị <b>1–${EMP.length}</b> / <b>30</b> nhân sự<span class="rt">Số dòng <span class="cb" style="height:26px">10${I('chevron-down', 12)}</span><span class="pgn">${I('chevron-left', 13)}</span><span class="pgn on">1</span><span class="pgn">2</span><span class="pgn">3</span><span class="pgn">${I('chevron-right', 13)}</span></span></div></div>
    <div class="lgx"><span class="cap">ĐIỂM</span><span class="pc" style="background:#2563EB;color:#fff">Đủ</span><span class="pc" style="background:#B45309;color:#fff">Một phần</span><span class="pc" style="background:#FFF1F2;color:#BE123C">Không</span><span class="pc" style="background:#7C3AED;color:#fff">Tăng ca</span><span class="sep"></span>

const PARTS = ['Văn phòng số', 'Vận hành kinh doanh', 'Nhân sự số'];
// Trình tự: bìa → (mở đầu phần → các màn của phần) × 3
const SL = [{ k: 'cover' }];
PARTS.forEach((_, p) => { SL.push({ k: 'part', p }); SC.forEach(s => { if (s.p === p) SL.push({ k: 'sc', s, p }); }); });
const $ = (id) => document.getElementById(id);
const stage = $('stage'), view = $('view'), fitbox = $('fitbox');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let cur = -1, cv = null, tk = 0;
const a = (i) => `a" style="animation-delay:${80 + i * 70}ms`;
function cover() {
  return `<div class="nar cover anim"><div class="lk ${a(0)}"><img src="${QN_LOGO}" alt="Quang Nhung"><span></span><div class="bs">${BRAND}Base.vn</div></div>
    <h1 class="${a(1)}">Quang Nhung trên Base</h1><p class="${a(2)}">Mockup các màn hình theo yêu cầu của Quang Nhung.</p>
    <div class="p3 ${a(3)}">${PARTS.map((p, i) => `<span>${i + 1}. ${p}</span>`).join('')}</div><small class="${a(4)}">Tên người, tên khách và số liệu trong màn hình là giả định. Bấm để xem tiếp.</small></div>`;
}
function partIntro(p) {
  const L = SC.filter(s => s.p === p);
  return `<div class="nar anim"><span class="eye ${a(0)}">Phần ${p + 1}</span><h2 class="${a(1)}">${PARTS[p]}</h2>
    <div class="steps5" style="grid-template-columns:repeat(${L.length > 6 ? 3 : 2},minmax(0,1fr))">${L.map((s, i) => `<div class="${a(2 + i)}"><img src="${APP_LOGO[s.app]}" alt=""><span><b>${s.t}</b><small>${s.need}</small></span></div>`).join('')}</div></div>`;
}
function paint(i, animate) {
  const s = SL[i];
  if (s.k === 'cover') view.innerHTML = cover();
  else if (s.k === 'part') view.innerHTML = partIntro(s.p);
  else {
    view.innerHTML = `<div class="mkv"><div class="mk-window cv ${animate ? 'anim' : ''}" id="cv">${win(s.s.app, s.s.nm, s.s.path, s.s.main())}</div></div><div class="capb"><img src="${APP_LOGO[s.s.app]}" alt=""><b>${s.s.t}</b><i></i><span>${s.s.how}</span></div>`;
    view.querySelectorAll('[data-d]').forEach(el => { el.style.animationDelay = (el.dataset.d * 1 + 320) + 'ms'; });
  }
  if (!animate) view.querySelectorAll('.anim').forEach(el => el.classList.remove('anim'));
  view.classList.toggle('in', animate);
  const p = s.k === 'cover' ? -1 : s.p;
  $('parts').innerHTML = PARTS.map((n, j) => `<button type="button" class="part ${p === j ? 'on' : ''}" data-p="${j}">${j + 1}. ${n}</button>`).join('');
  $('pos').textContent = `${i + 1} / ${SL.length}`; $('bar').style.width = ((i + 1) / SL.length * 100) + '%';
  $('prev').disabled = i === 0; $('next').disabled = i === SL.length - 1;
  try { history.replaceState(null, '', '#s' + (i + 1)); } catch (e) {}
}
function show(i, animate = true) {
  i = Math.max(0, Math.min(SL.length - 1, i)); if (i === cur) return;
  const first = cur < 0; cur = i; const my = ++tk; animate = animate && !reduce;
  if (first || !animate) { view.classList.remove('out'); paint(i, animate); return; }
  view.classList.remove('in'); view.classList.add('out');
  setTimeout(() => { if (my !== tk) return; paint(i, true); view.classList.remove('out'); }, 190);
}
function fit() { const s = Math.min((innerWidth - 32) / 1440, (innerHeight - 20) / 990); fitbox.style.width = (1440 * s) + 'px'; fitbox.style.height = (990 * s) + 'px'; stage.style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();
stage.addEventListener('click', (e) => {
  const b = e.target.closest('[data-p]'); if (b) { show(SL.findIndex(s => s.k === 'part' && s.p === +b.dataset.p)); return; }
  if (e.target.closest('#prev')) { show(cur - 1); return; }
  show(cur + 1);
});
addEventListener('keydown', (e) => {
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key) && !e.target.closest('button')) { e.preventDefault(); show(cur + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  else if (e.key === 'Home') { e.preventDefault(); show(0); }
});
const q = (location.hash.match(/^#s(\d+)$/) || [])[1];
show(q ? +q - 1 : 0, !q);

</script>
