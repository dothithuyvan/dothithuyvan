/* Layout: sân khấu tối 1600×1000 như bộ An Cơ — HUD (logo WASECO × Base.vn + 4 hạng mục) · bìa · bối cảnh · hành trình · mỗi hồi: trang mở + các bước (cột kể chuyện trái, cửa sổ app phải) · AI ở bước cuối mỗi hồi · kết */
:root{
  --dk0:#070b13;--dk1:#0c1424;--dkline:rgba(255,255,255,.09);--dkcard:rgba(255,255,255,.04);
  --dktext:#F2F6FB;--dksub:#8D97AE;--acc:#4F8CFF;--acc2:#7DD3FC;--aiL:#C4B5FD;
  --f:"Inter Variable","Segoe UI",system-ui,sans-serif;--mono:ui-monospace,Consolas,monospace;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--dk0);color:var(--dktext);font-family:var(--f);overflow:hidden}
#outer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 520px at 16% 6%,rgba(14,116,144,.22),transparent 60%),radial-gradient(700px 500px at 86% 92%,rgba(124,58,237,.13),transparent 60%),linear-gradient(180deg,var(--dk0),var(--dk1) 60%,var(--dk0))}
#cv{width:1600px;height:1000px;position:relative;flex:none;transform-origin:center center}
.hud{position:absolute;top:26px;left:64px;right:64px;display:flex;align-items:center;justify-content:space-between;z-index:5}
.lock{display:flex;align-items:center;gap:12px;font-weight:700;font-size:14px}
.lock img{height:34px;width:auto;display:block}
.lock .x{opacity:.35}
.lock .bv{display:flex;align-items:center;gap:6px;color:#cfe0ff;font-size:13px;opacity:.8}
.pills{display:flex;gap:8px}
.np{display:flex;align-items:center;gap:7px;padding:6px 12px 6px 7px;border-radius:99px;background:var(--dkcard);border:1px solid var(--dkline);color:var(--dksub);font-size:12.5px;font-weight:600;cursor:pointer}
.np img{width:20px;height:20px;border-radius:5px}
.np .hn{font-size:9.5px;opacity:.6;font-weight:700}
.np.on{background:rgba(79,140,255,.16);border-color:rgba(79,140,255,.45);color:#fff}
.np.done{opacity:.55}
.intro{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 64px}
.ey{font-size:12px;font-weight:700;letter-spacing:1.6px;color:var(--acc2);text-transform:uppercase;margin-bottom:16px}
.h1{font-size:50px;line-height:1.1;font-weight:800;letter-spacing:-.5px;margin:0 0 18px;max-width:1180px;text-wrap:balance}
.h1 b{background:linear-gradient(90deg,#8ec3ff,#5a9bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:17px;line-height:1.55;color:var(--dksub);max-width:800px;margin:0}
.center{align-items:center;text-align:center}.center .sub{margin:0 auto}
.coverlock{display:flex;align-items:center;gap:18px;background:var(--dkcard);border:1px solid var(--dkline);padding:14px 26px;border-radius:16px;margin-bottom:30px}
.coverlock img{height:64px}
.coverlock .sp{width:1px;height:36px;background:var(--dkline)}
.cpills{display:flex;gap:10px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.cp{display:flex;align-items:center;gap:8px;background:var(--dkcard);border:1px solid var(--dkline);border-radius:99px;padding:8px 16px;font-size:13px;font-weight:600;color:#dbe4f5}
.cp img{width:20px;height:20px;border-radius:6px}
.painrow{display:flex;gap:18px;margin-top:26px}
.pc{flex:1;max-width:340px;background:var(--dkcard);border:1px solid var(--dkline);border-radius:16px;padding:20px 22px}
.pc .ic{width:38px;height:38px;border-radius:10px;background:rgba(79,140,255,.15);display:grid;place-items:center;color:#9fc3ff;margin-bottom:12px}
.pc h4{font-size:15.5px;margin:0 0 6px}
.pc p{font-size:13.3px;color:var(--dksub);line-height:1.5;margin:0}
.roles{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.rc{display:flex;align-items:center;gap:9px;background:var(--dkcard);border:1px solid var(--dkline);border-radius:99px;padding:5px 14px 5px 5px}
.rc b{font-size:12.5px;display:block}.rc small{font-size:10.5px;color:var(--dksub);font-weight:600}
.foot{margin-top:22px;font-size:11.5px;color:#5c6680;font-weight:600}
.jrow{display:flex;gap:14px;margin-top:30px}
.jc{width:228px;background:var(--dkcard);border:1px solid var(--dkline);border-radius:16px;padding:18px}
.jc img{width:30px;height:30px;border-radius:8px;margin-bottom:12px}
.jc .t{font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--acc2);text-transform:uppercase;margin-bottom:5px}
.jc h5{font-size:16px;margin:0 0 7px}
.jc p{font-size:12.3px;color:var(--dksub);line-height:1.45;margin:0}
.jc.kq{background:linear-gradient(160deg,rgba(79,140,255,.14),rgba(124,58,237,.08))}
.chi{position:absolute;inset:0;display:flex;align-items:center;padding:0 64px}
.chi .l{flex:1;max-width:820px}
.big{font-size:118px;font-weight:800;line-height:1;background:linear-gradient(160deg,#9cc4ff,#3d6fd6);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.meta{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.mc{display:flex;align-items:center;gap:7px;background:var(--dkcard);border:1px solid var(--dkline);border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:600;color:#dbe4f5}
.orb{position:absolute;right:130px;top:50%;transform:translateY(-50%);width:260px;height:260px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(79,140,255,.14),transparent 70%)}
.orb i{position:absolute;inset:0;border-radius:50%;border:1px solid var(--dkline)}.orb i+i{inset:34px}
.orb img{width:92px;height:92px;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.step{position:absolute;top:104px;left:56px;right:56px;bottom:50px;display:flex;gap:30px}
.narr{width:318px;flex:none;display:flex;flex-direction:column}
.badge{display:inline-flex;width:fit-content;font-size:10.5px;font-weight:800;letter-spacing:.7px;color:var(--acc2);background:rgba(79,140,255,.12);border:1px solid rgba(79,140,255,.3);padding:5px 10px;border-radius:99px;text-transform:uppercase;margin-bottom:14px}
.narr h2{font-size:25px;font-weight:800;line-height:1.18;margin:0 0 18px;text-wrap:balance}
.sl{display:flex;flex-direction:column;gap:7px}
.si{display:flex;gap:12px;padding:11px 13px;border-radius:12px;border:1px solid transparent}
.si.on{background:var(--dkcard);border-color:var(--dkline)}
.si .n{width:24px;height:24px;border-radius:99px;flex:none;display:grid;place-items:center;font-size:11.5px;font-weight:800;margin-top:1px;background:#2563EB;color:#fff}
.si.todo{opacity:.5}.si.todo .n{background:var(--dkcard);border:1px solid var(--dkline);color:var(--dksub)}
.si.ai .n{background:#7C3AED}
.si .tt{font-size:13.5px;font-weight:700;color:#e7ecf7}
.si .ss{font-size:11.3px;color:var(--dksub);font-weight:600;margin-top:1px}
.si .bd{font-size:12.3px;color:var(--dksub);line-height:1.5;margin-top:6px}
.si.ai.on{border-color:rgba(196,181,253,.35);background:rgba(124,58,237,.12)}
.si.ai .tt{color:var(--aiL)}
.ww{flex:1;min-width:0;display:flex;justify-content:center;align-items:flex-start}
.wscale{width:1140px;height:697px;position:relative;flex:none}
.wscale>.mk-window{position:absolute;left:0;top:0;transform:scale(.7917);transform-origin:0 0}
.hint{position:absolute;left:64px;bottom:18px;font-size:11.5px;color:#5c6680;font-weight:600}
.dots{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:5px}
.dots i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.14);cursor:pointer}
.dots i.on{background:var(--acc);width:18px}
.cnt{position:absolute;right:64px;bottom:18px;font-size:11.5px;color:#5c6680;font-weight:700}
.endrow{display:flex;gap:0;margin-top:34px;position:relative}
.tlc{flex:1;position:relative;padding-top:30px}
.tlc::before{content:"";position:absolute;top:8px;left:0;right:0;height:2px;background:var(--dkline)}
.tlc::after{content:"";position:absolute;top:2px;left:0;width:14px;height:14px;border-radius:50%;background:var(--acc)}
.tlc .tm{font-family:var(--mono);font-size:13px;color:var(--acc2);font-weight:700}
.tlc h5{font-size:15px;margin:6px 0 4px}
.tlc p{font-size:12.3px;color:var(--dksub);margin:0;line-height:1.45;max-width:250px}
.rmap{display:flex;gap:14px;margin-top:30px}
.rmap div{flex:1;background:var(--dkcard);border:1px solid var(--dkline);border-radius:14px;padding:16px 18px}
.rmap b{font-size:14px}.rmap span{display:block;font-size:12.5px;color:var(--dksub);margin-top:6px;line-height:1.5}

/* ===== mock window (luôn nền sáng như app thật) ===== */
.mk-window{--ink:#111827;--text:#1F2937;--mut:#6B7280;--dim:#9CA3AF;--line:#E5E7EB;--ls:#F3F4F6;--bg:#fff;--bs:#F9FAFB;--blue:#2563EB;--bsoft:#DBEAFE;--bink:#1D4ED8;--org:#F59E0B;--osoft:#FFF7ED;--red:#DC2626;--rsoft:#FEE2E2;--grn:#16A34A;--gsoft:#DCFCE7;--cyan:#0891B2;--vi:#7C3AED;--vsoft:#EDE9FE;--vink:#6D28D9;--vbg:#F5F3FF;
  width:1440px;height:880px;border-radius:14px;overflow:hidden;background:#fff;color:var(--text);font:13px/1.35 var(--f);box-shadow:0 30px 80px rgba(15,23,42,.18);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;color-scheme:light}
.mk-window *{box-sizing:border-box}
.mk-window b{color:var(--ink);font-weight:600}
.chrome{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#F3F4F6;border-bottom:1px solid var(--line);flex:none}
.chrome i{width:11px;height:11px;border-radius:50%;display:block}
.chrome .url{margin-left:10px;flex:1;display:flex;align-items:center;height:26px;padding:0 10px;background:#fff;border:1px solid var(--line);border-radius:7px;font-size:11.5px;color:var(--mut)}
.chrome .url b{font-weight:600}
.top{display:flex;align-items:center;gap:14px;height:48px;padding:0 16px;border-bottom:1px solid var(--line);flex:none}
.top .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--ink)}
.top .brand svg{color:var(--blue)}
.top .search{margin:0 auto;display:flex;align-items:center;gap:8px;width:360px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--bs);color:var(--mut);font-size:12.5px}
.top .search kbd{margin-left:auto;font-size:10px;padding:1px 5px;border:1px solid var(--line);border-radius:4px;color:var(--dim);background:#fff;font-family:var(--f)}
.top .icons{display:flex;align-items:center;gap:14px;color:var(--mut)}
.app{flex:1;display:flex;min-height:0}
.side{width:212px;flex:none;padding:12px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.side .title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--ink);padding:4px 8px 12px}
.side .row{display:flex;align-items:center;gap:9px;height:30px;padding:0 9px;border-radius:7px;font-size:13px;white-space:nowrap;overflow:hidden;color:var(--text)}
.side .row.on{background:var(--blue);color:#fff;font-weight:600}
.side .row.sub{padding-left:24px;font-size:12.5px}
.side .row.sub i{width:6px;height:6px;border-radius:50%;flex:none}
.side .row.subon{background:var(--bsoft);color:var(--bink);font-weight:600}
.side .ltr{width:17px;height:17px;border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.side .chev{margin-left:auto;color:var(--dim)}
.side .sec{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--mut);padding:14px 9px 4px}
.side .foot{margin-top:auto;display:grid;gap:2px;padding-top:12px;border-top:1px solid var(--ls)}
.ws{display:flex;align-items:center;gap:8px;padding:6px 9px;font-weight:600;color:var(--ink)}
.ws .ltr{background:#0E7490;width:22px;height:22px;font-size:11px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;position:relative}
.head{display:flex;align-items:center;gap:8px;height:52px;padding:0 18px;border-bottom:1px solid var(--line);flex:none}
.head .crumb{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--ink);font-size:14px;white-space:nowrap}
.head .crumb .lt{color:var(--mut);font-weight:500}
.svc{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:7px;background:var(--blue);color:#fff;font-weight:600;font-size:13px;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.ai{background:var(--vsoft);color:var(--vink)}
.btn.red{background:#fff;color:var(--red);border:1px solid #FCA5A5}
.ml{margin-left:auto}
.tabs{display:flex;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);height:44px;align-items:stretch;flex:none}
.tabs span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);font-weight:500;border-bottom:2px solid transparent}
.tabs span.on{color:var(--ink);border-color:var(--blue);font-weight:600}
.tbar{display:flex;align-items:center;gap:8px;padding:10px 18px;flex:none}
.tb{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;color:var(--text);background:#fff;white-space:nowrap}
.q{display:inline-flex;align-items:center;gap:8px;width:240px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:7px;color:var(--mut);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.blue{background:var(--bsoft);color:var(--bink)}.pill.green{background:var(--gsoft);color:#15803D}.pill.red{background:var(--rsoft);color:var(--red)}.pill.org{background:#FFEDD5;color:#C2410C}.pill.grey{background:var(--ls);color:#4B5563}.pill.vi{background:var(--vsoft);color:var(--vink)}.pill.cyan{background:#ECFEFF;color:var(--cyan)}
.solid-g{background:#22A55B;color:#fff}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:9px;font-weight:700;color:#fff;flex:none}
.mono{font-family:var(--mono);font-size:11.5px;color:var(--mut)}
.caps{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
.card{background:#fff;border:1px solid var(--line);border-radius:10px}

/* pipeline */
.board{flex:1;display:flex;gap:12px;padding:6px 18px 18px;overflow:hidden;min-height:0}
.col{flex:1;min-width:0;background:var(--bs);border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:10px}
.colh{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--ink);font-size:13px;padding:2px 2px 4px}
.colh .n{margin-left:auto;font-size:11.5px;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 7px}
.job{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.job .jt{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-family:var(--mono);font-size:11px;color:var(--mut);background:var(--bs);border-bottom:1px solid var(--ls)}
.job.late .jt{background:#FEF2F2;color:#B91C1C}
.job.done .jt{background:#F0FDF4;color:#15803D}
.job .jb{padding:9px 10px;display:grid;gap:7px}
.job .jb>b{font-size:13.5px;font-weight:500;line-height:1.3}
.job .jf{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut)}
.job .jf .dl{margin-left:auto;display:inline-flex;gap:4px;align-items:center}
.job .acts{display:flex;justify-content:flex-end;gap:6px;padding:0 10px 9px}
.job .acts i{width:24px;height:24px;border-radius:6px;display:grid;place-items:center}
.job.hl{box-shadow:0 0 0 2px var(--blue)}
.aibadge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--vink);background:var(--vbg);border:1px solid #DDD6FE;border-radius:999px;padding:1px 7px}

/* job detail */
.jd{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0;overflow:hidden}
.jd .l{padding:16px 20px;display:flex;flex-direction:column;gap:12px;overflow:hidden;border-right:1px solid var(--line)}
.jd .r{padding:14px 16px;display:flex;flex-direction:column;gap:12px;overflow:hidden;background:#fff}
.jd h1{font-size:22px;font-weight:700;color:var(--ink);margin:0}
.kvrow{display:flex;align-items:center;gap:8px;font-size:12.5px}
.kvrow .k{width:44px;color:var(--mut);font-size:10.5px;font-weight:700;letter-spacing:.06em}
.steps{display:flex;gap:4px}
.steps span{flex:1;display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;font-size:12px;background:var(--ls);color:var(--mut);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%);white-space:nowrap;overflow:hidden}
.steps span:first-child{clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%)}
.steps span.d{background:var(--gsoft);color:#15803D}
.steps span.c{background:var(--blue);color:#fff;font-weight:600}
.sect{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sect .sh{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:600;color:var(--ink);border-bottom:1px solid var(--ls)}
.fl{display:grid}
.fl .f{display:grid;grid-template-columns:26px 190px minmax(0,1fr);align-items:center;gap:8px;padding:5px 14px;border-bottom:1px solid var(--ls);font-size:13px;min-height:33px}
.fl .f:last-child{border-bottom:0}
.fl .f .no{color:var(--dim);font-size:11.5px;font-family:var(--mono)}
.fl .f .lb{color:var(--mut)}
.fl .f .vl{color:var(--ink);font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.fl .f .vl.empty{color:var(--dim);font-weight:400}
.fl .f.fill{animation:fillg 1.4s ease both}
@keyframes fillg{0%{background:var(--vbg)}70%{background:var(--vbg)}100%{background:transparent}}
.post{display:flex;gap:10px;padding:10px 14px}
.post .bd{display:grid;gap:4px;font-size:13px}
.post .who{font-size:12.5px;color:var(--mut)}
.post .who b{color:var(--blue)}
.zalo{background:var(--bs);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;display:grid;gap:6px}
.thumbs{display:flex;gap:6px}
.thumbs i{width:48px;height:34px;border-radius:6px;background:linear-gradient(135deg,#CBD5E1,#94A3B8);display:grid;place-items:center;color:#fff}
.rp .rh{display:flex;align-items:center;justify-content:space-between;font-weight:600;color:var(--ink);font-size:13px}
.rp{display:grid;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--ls)}
.appr{display:flex;align-items:center;gap:10px;font-size:12.5px}
.appr .nm{display:grid;line-height:1.3}
.appr .nm b{font-weight:600}
.appr .nm span{color:var(--mut);font-size:11.5px}
.appr .st{margin-left:auto}
.tl{height:6px;border-radius:3px;background:var(--ls);overflow:hidden}
.tl i{display:block;height:100%}
.advis{border:1px solid #DDD6FE;background:var(--vbg);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.advis .ah{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--vink);font-size:12px;letter-spacing:.04em}
.advis ul{margin:0;padding-left:16px;display:grid;gap:5px;font-size:13px;color:var(--text)}

/* AI panel */
.aipanel{position:absolute;right:16px;top:12px;bottom:12px;width:420px;background:#fff;border-radius:14px;box-shadow:0 24px 70px rgba(17,24,39,.22);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;z-index:5}
.aipanel .ph{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-bottom:1px solid var(--ls);font-weight:600;color:var(--ink)}
.aic{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#A78BFA,#6D28D9);display:grid;place-items:center;color:#fff;flex:none}
.aipanel .pb{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.focus{align-self:flex-start;font-size:11.5px;color:var(--mut);background:var(--ls);border-radius:999px;padding:3px 10px}
.qbub{align-self:flex-end;max-width:85%;background:var(--blue);color:#fff;border-radius:12px 12px 2px 12px;padding:8px 12px;font-size:13px}
.ans{display:grid;gap:9px}
.ans .ar{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:13px;line-height:1.45}
.ans .k{font-size:11px;font-weight:700;color:var(--vink);background:var(--vbg);border-radius:5px;padding:2px 6px;white-space:nowrap}
.src{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--mut)}
.src span{border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.fu{display:flex;flex-wrap:wrap;gap:6px}
.fu span{font-size:12px;color:var(--vink);border:1px solid #DDD6FE;border-radius:999px;padding:4px 10px}
.aipanel .pf{padding:10px 14px;border-top:1px solid var(--ls);display:grid;gap:6px}
.aipanel .inp{display:flex;align-items:center;gap:8px;height:36px;border:1px solid var(--line);border-radius:9px;padding:0 10px;color:var(--dim);font-size:12.5px}
.aipanel .disc{font-size:11px;color:var(--dim);text-align:center}

/* flow canvas */
.fhead{display:flex;align-items:center;gap:10px;height:58px;padding:0 18px;border-bottom:1px solid var(--line);flex:none}
.fhead .t{font-size:16px;font-weight:700;color:var(--ink)}
.flowwrap{flex:1;display:flex;min-height:0}
.palette{width:270px;flex:none;border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.palette .gc{font-size:10.5px;font-weight:700;letter-spacing:.06em;margin-top:6px}
.pa{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.pa .ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.pa div{display:grid;line-height:1.3}
.pa div span{font-size:11.5px;color:var(--mut)}
.pa.hot{border-color:#DDD6FE;background:var(--vbg)}
.canvas{flex:1;position:relative;background-color:#FAFAFA;background-image:radial-gradient(#E2E8F0 1px,transparent 1px);background-size:18px 18px;overflow:hidden}
.node{position:absolute;width:236px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.node .nh{display:flex;align-items:center;gap:8px;padding:9px 10px}
.node .lq{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.node .nt{display:grid;line-height:1.25;min-width:0}
.node .nt b{font-size:13px}
.node .nt span{font-size:11.5px;color:var(--mut)}
.node .kind{margin-left:auto}
.node .nb{border-top:1px solid var(--ls);padding:8px 10px;display:grid;gap:6px;font-size:11.5px;color:var(--mut)}
.node.agent{border-color:#C4B5FD}
.node .ab{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.node .model{font-family:var(--mono);font-size:10.5px;color:var(--vink);background:var(--vbg);border:1px solid #DDD6FE;border-radius:5px;padding:1px 6px}
.node .prompt{font-style:italic;color:var(--text)}
.node .br{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.node .br .cap2{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--dim)}
.node .br span.b{font-size:11px;border-radius:5px;padding:1px 7px}
.b.ok{background:var(--gsoft);color:#15803D}.b.warn{background:#FFEDD5;color:#C2410C}.b.bad{background:var(--rsoft);color:var(--red)}
svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* vertical workflow (BPM Workflow view) */
.wf{flex:1;position:relative;background-color:#FAFAFA;background-image:radial-gradient(#E2E8F0 1px,transparent 1px);background-size:18px 18px;overflow:hidden}
.wn{position:absolute;width:224px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--c);border-radius:8px;padding:8px 10px;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.wn b{display:flex;align-items:center;gap:6px;font-size:13px}
.wn span{font-size:11.5px;color:var(--mut)}
.wn .cnt{position:absolute;right:-8px;top:-10px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:#9CA3AF}
.wn .cnt.r{background:var(--red)}
.chip2{position:absolute;font-size:11px;border:1px dashed;border-radius:6px;padding:2px 8px;background:#fff;white-space:nowrap}
.traffic{position:absolute;left:18px;top:14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:center;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg span{padding:2px 8px;font-size:11.5px;color:var(--mut)}
.seg span.on{background:var(--bsoft);color:var(--bink);font-weight:600}

/* office doc */
.doc{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0;overflow:hidden}
.doc .l{padding:18px 22px;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--line);overflow:hidden}
.doc .r{padding:16px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.aisum{border-left:3px solid var(--vi);background:var(--vbg);border-radius:0 10px 10px 0;padding:12px 14px;display:grid;gap:8px}
.aisum .ah{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--vink)}
.aisum p{margin:0;font-size:13.5px;line-height:1.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.grid2 div{display:grid;gap:2px}
.grid2 span{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--mut)}
.grid2 b{font-weight:500}
.stp{display:flex;align-items:flex-start;gap:0}
.stp div{flex:1;display:grid;justify-items:center;gap:6px;text-align:center;font-size:11.5px;color:var(--mut);position:relative}
.stp div:not(:last-child)::after{content:"";position:absolute;top:11px;left:calc(50% + 14px);right:calc(-50% + 14px);height:2px;background:var(--line)}
.stp i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;background:var(--ls);color:var(--mut);z-index:1}
.stp .d i{background:var(--grn);color:#fff}.stp .c i{background:var(--blue);color:#fff}.stp .c{color:var(--ink);font-weight:600}
.task{border:1px solid #FED7AA;background:#FFF7ED;border-radius:10px;padding:10px 12px;display:grid;gap:6px;font-size:12.5px}

/* project */
.sub2{width:220px;flex:none;border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.sub2 .row{display:flex;align-items:center;gap:8px;height:30px;padding:0 9px;border-radius:7px;font-size:13px;white-space:nowrap}
.sub2 .row.on{background:var(--bsoft);color:var(--bink);font-weight:600}
.sub2 .row em{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--mut)}
.sub2 .sec{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--mut);padding:14px 9px 4px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--mut);background:var(--bs);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:0 12px;height:60px;border-bottom:1px solid var(--ls);white-space:nowrap}
table.t td.n{font-variant-numeric:tabular-nums;text-align:right}
table.t th.n{text-align:right}
.pj{display:flex;align-items:center;gap:10px}

.pxchat .cmp{flex:none;margin:10px 12px 12px;border:1px solid #93C5FD;border-radius:10px;background:#fff}
.pxchat .cmp .ct{display:flex;gap:16px;padding:0 12px;border-bottom:1px solid var(--ls);height:34px;align-items:stretch}
.pxchat .cmp .ct span{display:flex;align-items:center;font-size:12.5px;color:var(--mut);border-bottom:2px solid transparent}.pxchat .cmp .ct span.on{color:var(--blue);font-weight:600;border-color:var(--blue)}
.pxchat .cmp .ph{padding:10px 12px;font-size:12.5px;color:var(--dim);height:44px}
.pxchat .cmp .ic{display:flex;gap:12px;align-items:center;padding:0 12px 10px}
.pxr{width:300px;flex:none;overflow:hidden;display:flex;flex-direction:column}
.pxr .hd{display:flex;align-items:center;gap:9px;height:52px;padding:0 12px;border-bottom:1px solid var(--line)}
.pxr .hd div{display:grid;line-height:1.3}.pxr .hd div b{font-size:13px}.pxr .hd div span{font-size:11.5px;color:var(--mut)}
.pxr .sx{padding:11px 14px;border-bottom:1px solid var(--ls);display:grid;gap:7px}
.pxr .st{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--mut)}
.pxr .kv{display:grid;grid-template-columns:96px 1fr;gap:6px;font-size:12.5px;align-items:center}.pxr .kv span{color:var(--mut)}.pxr .kv b{font-weight:500;display:inline-flex;align-items:center;gap:5px;min-width:0}
.pxr .sel{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;color:var(--mut)}
.pxr .sel div{display:grid;line-height:1.25}.pxr .sel div b{font-size:12.5px}.pxr .sel div span{font-size:11px;color:var(--mut)}
.pxr .sel.ag{border-color:#DDD6FE;background:var(--vbg)}.pxr .sel .bot{width:24px;height:24px}
.pxr .lk{font-size:12px;color:var(--blue);font-weight:500;display:inline-flex;align-items:center;gap:4px}
.pxstrip{width:36px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;color:var(--mut)}
.pxstrip i{width:28px;height:28px;border-radius:7px;display:grid;place-items:center}.pxstrip i.on{background:var(--bsoft);color:var(--bink)}
.pxmask{position:absolute;left:0;right:0;top:85px;bottom:0;background:rgba(17,24,39,.32);display:flex;justify-content:center;align-items:flex-start;padding-top:110px;z-index:9}
.pxmodal{width:560px;background:#fff;border-radius:14px;box-shadow:0 30px 80px rgba(17,24,39,.3);overflow:hidden}
.pxmodal .mh{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--ls)}
.pxmodal .mh .mi{width:32px;height:32px;border-radius:8px;background:var(--bsoft);color:var(--bink);display:grid;place-items:center;flex:none}
.pxmodal .mh div{display:grid;gap:2px}.pxmodal .mh b{font-size:16px}.pxmodal .mh span{font-size:12.5px;color:var(--mut)}
.pxmodal .mb{padding:14px 18px;display:grid;gap:8px}
.pxmodal label{font-size:12.5px;font-weight:600;color:var(--ink);margin-top:4px}.pxmodal label em{color:var(--red);font-style:normal}
.pxmodal .fx{display:flex;align-items:center;gap:8px;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--bs)}
.pxmodal .fx.sel2{background:#fff;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12);font-weight:500}
.pxmodal .opts{border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(17,24,39,.12);overflow:hidden}
.pxmodal .opts div{display:flex;align-items:center;gap:8px;height:36px;padding:0 11px;font-size:13px;border-top:1px solid var(--ls)}.pxmodal .opts div:first-child{border-top:0}
.pxmodal .opts div.on{background:#EFF6FF;color:var(--bink);font-weight:600}
.pxmodal .wrn{display:flex;gap:9px;align-items:flex-start;background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:9px 11px;font-size:12.5px;color:#92400E;margin-top:4px}
.pxmodal .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--ls)}
/* lộ trình */
.rmhd{display:flex;align-items:center;gap:28px;padding:16px 20px 10px}
.rmhd>div:first-child{flex:1;display:grid;gap:3px}.rmhd>div:first-child b{font-size:21px;font-weight:700}.rmhd>div:first-child span{font-size:12.5px;color:var(--mut)}
.rmhd .k{display:grid;justify-items:end;gap:1px}.rmhd .k b{font-size:24px;font-weight:700}.rmhd .k span{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--mut)}
.rmg{position:relative;margin:4px 16px 0;height:372px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.rmg .mh{position:absolute;left:0;right:0;top:0;height:28px;border-bottom:1px solid var(--line);background:var(--bs)}
.rmg .mh span{position:absolute;top:0;height:28px;display:flex;align-items:center;padding-left:7px;font-size:11px;font-weight:600;color:var(--mut)}
.rmg .gl i{position:absolute;top:0;bottom:0;width:1px;background:var(--ls)}
.rmg .cap{position:absolute;left:12px;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--mut)}
.rmg .sep{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.rmrow{position:absolute;left:0;right:0;height:28px}
.rmrow .lb{position:absolute;left:12px;top:5px;width:176px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.rmrow .bar{position:absolute;top:4px;height:20px;border-radius:5px;border:1px solid;overflow:hidden}
.rmrow .bar i{display:block;height:100%}
.rmrow .rmpc{position:absolute;top:7px;font-size:11px;font-weight:700}
.rmms.end{align-items:flex-end;translate:calc(-100% + 14px) 0}
.rmms{position:absolute;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.rmms i{width:14px;height:14px;transform:rotate(45deg);border:2px solid;border-radius:2px}
.rmms span{font-size:11.5px;white-space:nowrap;color:var(--text)}
.rmms.lo span{margin-top:18px}
.rmg .today{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--red);z-index:2}
.rmg .today span{position:absolute;top:34px;left:4px;font-size:10px;font-weight:700;color:#fff;background:var(--red);border-radius:4px;padding:1px 5px;white-space:nowrap}
.rmlg{display:flex;gap:22px;align-items:center;padding:12px 20px;font-size:11.5px;color:var(--mut)}
.rmlg span{display:inline-flex;align-items:center;gap:6px}
.rmlg i.b{width:22px;height:8px;border-radius:3px;background:linear-gradient(90deg,#16A34A 60%,#DCFCE7 60%)}
.rmlg i.d{width:9px;height:9px;transform:rotate(45deg);background:#C2410C}
.rmlg i.t{width:2px;height:12px;background:var(--red)}
@media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}}
</style>

/* ======= ĐIỀU KHIỂN ======= */
const cv=document.getElementById('cv');const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;let CUR=0,TM=[];
const firstOf=ch=>S.findIndex(s=>s.ch===ch);
function typeAI(){TM.forEach(clearTimeout);TM=[]}
function render(){typeAI();const s=S[CUR];cv.innerHTML=`${s.ch?hud(s.ch):''}${s.r()}<div class="hint">${s.h}</div><div class="dots">${S.map((_,i)=>`<i class="${i===CUR?'on':''}" data-i="${i}"></i>`).join('')}</div><div class="cnt">${CUR+1} / ${S.length}</div>`;
cv.querySelectorAll('[data-go]').forEach(e=>e.addEventListener('click',ev=>{ev.stopPropagation();go(firstOf(+e.dataset.go))}));cv.querySelectorAll('.dots i').forEach(e=>e.addEventListener('click',ev=>{ev.stopPropagation();go(+e.dataset.i)}));try{history.replaceState(null,'','#s'+(CUR+1))}catch(e){}}
function go(i){CUR=Math.max(0,Math.min(S.length-1,i));render()}
cv.addEventListener('click',()=>go(CUR+1));
addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(CUR+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(CUR-1)}});
function fit(){const sc=Math.min(innerWidth/1600,innerHeight/1000);cv.style.transform=`scale(${sc})`}
addEventListener('resize',fit);fit();
const m=(location.hash||'').match(/^#s(\d+)$/);let q=null;try{q=new URLSearchParams(location.search).get('s')}catch(e){}
go(m?+m[1]-1:(q?+q-1:0));
</script>
