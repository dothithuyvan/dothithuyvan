/* motion */
.anim .rv{opacity:0;animation:rv .45s ease-out forwards}
@keyframes rv{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ring circle.pg{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.3,1)}
.stepi{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:9;pointer-events:none;font:600 11px/1 var(--font-body);color:#fff;background:rgba(15,23,42,.38);padding:4px 9px;border-radius:999px;letter-spacing:.02em;transition:opacity .4s}
.stepi.fade{opacity:0;transition:opacity .8s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.anim .rv{opacity:1!important}}

// ===== MO · lớp chuyển động: con trỏ, bấm, gõ chữ, hiện dần, đếm số, AI "đang nghĩ" =====
// Mỗi cảnh có s.play = async (m) => {...}. Bấm sang cảnh khác thì kịch bản cũ dừng ngay.
const MO = (() => {
  let tok = 0, pos = { x: 760, y: 640 };
  class Stop extends Error {}
  const cvE = () => document.getElementById('cv');
  const sc = () => { const m = (cvE().style.transform || '').match(/scale\(([\d.]+)\)/); return m ? +m[1] : 1; };
  const q = (s) => typeof s === 'string' ? cvE().querySelector(s) : s;
  const qa = (s) => typeof s === 'string' ? [...cvE().querySelectorAll(s)] : Array.isArray(s) ? s : (s ? [s] : []);
  const rel = (el) => { const r = el.getBoundingClientRect(), c = cvE().getBoundingClientRect(), k = sc(); return { x: (r.left - c.left) / k, y: (r.top - c.top) / k, w: r.width / k, h: r.height / k }; };
  const fmt = (n, dd) => (+dd ? n.toFixed(+dd).replace('.', ',') : Math.round(n).toLocaleString('vi-VN'));
  function cursor() {
    let k = document.getElementById('mcur');
    if (!k) { k = document.createElement('div'); k.id = 'mcur'; k.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 2.5l14.5 9-6.6 1.5-3.4 6.5z" fill="#111827" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg><i></i>'; cvE().appendChild(k); }
    return k;
  }
  function mk(id, fast) {
    const live = () => { if (id !== tok) throw new Stop(); };
    const wait = (ms) => new Promise((res, rej) => setTimeout(() => (id === tok ? res() : rej(new Stop())), fast ? 0 : ms));
    const place = (x, y, dur) => { const k = cursor(); k.style.transition = dur && !fast ? `left ${dur}ms cubic-bezier(.45,0,.2,1), top ${dur}ms cubic-bezier(.45,0,.2,1)` : 'none'; k.style.left = x + 'px'; k.style.top = y + 'px'; pos = { x, y }; };
    const m = {
      fast, q, qa, wait,
      hide(sel) { qa(sel).forEach(e => { e.classList.add('mh'); e.classList.remove('mi'); }); },
      show(sel) { qa(sel).forEach(e => e.classList.add('mh', 'mi')); },
      async seq(sel, gap = 160) { for (const e of qa(sel)) { live(); e.classList.add('mh', 'mi'); await wait(gap); } },
      async move(sel, o = {}) {
        const el = q(sel); if (!el) return; const r = rel(el);
        const x = r.x + (o.fx ?? 0.5) * r.w + (o.dx || 0), y = r.y + (o.fy ?? 0.55) * r.h + (o.dy || 0);
        const dur = o.dur || Math.min(1000, 380 + Math.hypot(x - pos.x, y - pos.y) * 0.55);
        cursor().classList.add('on'); place(pos.x, pos.y, 0); void cursor().offsetWidth; place(x, y, dur); await wait(dur + 80);
      },
      async click(sel, o = {}) {
        await m.move(sel, o); const k = cursor(); k.classList.remove('clk'); void k.offsetWidth; k.classList.add('clk');
        const el = q(sel); if (el) { el.classList.add('mclk'); setTimeout(() => el.classList.remove('mclk'), 450); } await wait(o.after ?? 320);
      },
      async type(sel, text, cps = 30) {
        const el = q(sel); if (!el) return; el.classList.add('mtyping');
        if (fast) el.textContent = text; else for (let i = 1; i <= text.length; i++) { live(); el.textContent = text.slice(0, i); await wait(1000 / cps); }
        el.classList.remove('mtyping');
      },
      async count(sel, dur = 900) {
        const T = qa(sel).map(e => [e, parseFloat(e.dataset.n), e.dataset.d || 0, e.dataset.s || '']);
        if (fast) { T.forEach(([e, n, dd, s]) => e.textContent = fmt(n, dd) + s); return; }
        const t0 = performance.now();
        await new Promise((res, rej) => { const f = () => { if (id !== tok) return rej(new Stop()); const p = Math.min(1, (performance.now() - t0) / dur), z = 1 - Math.pow(1 - p, 3); T.forEach(([e, n, dd, s]) => e.textContent = fmt(n * z, dd) + s); p < 1 ? requestAnimationFrame(f) : res(); }; f(); });
      },
      grow0(sel) { qa(sel).forEach(e => { if (e.dataset.w0 === undefined) e.dataset.w0 = e.style.width || e.dataset.w || ''; e.style.transition = 'none'; e.style.width = '0'; }); },
      async grow(sel, gap = 120) { void cvE().offsetWidth; for (const e of qa(sel)) { e.style.transition = fast ? 'none' : 'width .9s cubic-bezier(.2,.8,.3,1)'; e.style.width = e.dataset.w0 || e.dataset.w; if (gap) await wait(gap); } },
      async think(afterSel, ms = 1100) {
        const a = q(afterSel); if (!a) return; const t = document.createElement('div'); t.className = 'mthink'; t.innerHTML = '<i></i><i></i><i></i>';
        a.insertAdjacentElement('afterend', t); try { await wait(ms); } finally { t.remove(); }
      },
      async stream(sel, gap = 200) {   // hiện lần lượt con trực tiếp; danh sách (ul) thì hiện từng dòng
        const box = q(sel); if (!box) return; const kids = [...box.children];
        kids.forEach(k => { k.classList.add('mh'); if (k.tagName === 'UL') { k.classList.add('mi'); [...k.children].forEach(li => li.classList.add('mh')); } });
        for (const k of kids) { live(); if (k.tagName === 'UL') { for (const li of k.children) { li.classList.add('mi'); await wait(gap); } } else { k.classList.add('mi'); await wait(gap); } }
      },
      cls(sel, c, on = true) { qa(sel).forEach(e => e.classList.toggle(c, on)); },
      park() { cursor().classList.remove('on'); },
    };
    return m;
  }
  function start(fn, animate = true) {
    const id = ++tok; const m = mk(id, !animate);
    const k = cursor(); k.classList.remove('clk'); k.style.transition = 'none'; k.style.left = pos.x + 'px'; k.style.top = pos.y + 'px';
    if (!fn) { k.classList.remove('on'); return; }
    Promise.resolve().then(() => fn(m)).catch(e => { if (!(e instanceof Stop)) console.error(e); })
      .finally(() => { if (id === tok && !animate) cvE().querySelectorAll('.mh').forEach(e => e.classList.add('mi')); });
  }
  return { start };
})();

const cv = document.getElementById('cv'), scaler = document.getElementById('scaler'), stepi = document.getElementById('stepi');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let cur = -1, tmr;
function grow() { cv.querySelectorAll('circle.pg').forEach(c => c.style.strokeDashoffset = c.dataset.to); cv.querySelectorAll('[data-w]').forEach(g => { if (!g.classList.contains('nogrow')) g.style.width = g.dataset.w; }); }
function show(i, animate = true) {
  i = Math.max(0, Math.min(SC.length - 1, i)); const s = SC[i], prev = cur; cur = i;

const EMBED = /[?&]embed/.test(location.search);

function fit() { const col = scaler.parentElement.clientWidth; const s = Math.min(col / 1440, (innerHeight - (EMBED ? 0 : 32)) / 880); scaler.style.width = (1440 * s) + 'px'; scaler.style.height = (880 * s) + 'px'; cv.style.transform = `scale(${s})`; }
addEventListener('resize', fit); new ResizeObserver(fit).observe(scaler.parentElement); fit();
