.mks .t{font:700 40px/1.14 "Be Vietnam Pro";letter-spacing:-.025em}.mks .t em{font-style:normal;color:var(--red)}
.kcaps{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;counter-reset:k}

.kframe{position:absolute;left:566px;top:118px;width:1296px;height:792px;border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(60,20,25,.18),0 0 0 1px var(--line);background:#E9EDF2}
.kframe iframe{position:absolute;left:0;top:0;width:1440px;height:880px;border:0;transform:scale(.9);transform-origin:0 0;pointer-events:none}

#ctl{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:999px;background:rgba(255,255,255,.85);border:1px solid #E7DEDB;backdrop-filter:blur(8px);z-index:20;font:500 13px/1 Inter,system-ui;color:#6E6264;opacity:.4;transition:opacity .3s}

</style></head><body>
<div id="vp"><div id="stage">
<!--SLIDES-->
</div></div>
<div id="ctl"><button id="bp" aria-label="Lùi">‹</button><span id="cnt"></span><button id="bn" aria-label="Tiếp">›</button><button id="bf" aria-label="Toàn màn hình">⤢</button></div>
<!--MOCKS-->
<script>(function(){
const stage=document.getElementById('stage'),slides=[...stage.querySelectorAll('.slide')],cnt=document.getElementById('cnt');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/960);stage.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-960*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();
const MK={};document.querySelectorAll('script[type="text/mock"]').forEach(s=>{const bin=atob(s.textContent.trim());const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
 MK[s.dataset.id]=URL.createObjectURL(new Blob([u8],{type:'text/html'}))});
slides.forEach(sl=>{if(sl.dataset.mk){const f=sl.querySelector('iframe');f.addEventListener('load',()=>{f.dataset.ready=1;if(slides[cur]===sl)render(false)});f.src=MK[sl.dataset.mk]}});
function mockGo(sl,n,anim){const f=sl.querySelector('iframe');if(f.dataset.ready){try{f.contentWindow.postMessage({mockGo:n,anim},'*')}catch(e){}}}
let cur=-1,step=0;
function render(anim=true){const sl=slides[cur];const st=step;
 sl.querySelectorAll('[data-s]').forEach(e=>e.classList.toggle('in',+e.dataset.s<=st));
 sl.querySelectorAll('.kcaps li').forEach(li=>{const i=+li.dataset.i;li.className=i===st?'now':i<st?'past':''});
 if(sl.dataset.mk){const map=JSON.parse(sl.dataset.map);mockGo(sl,map[st],anim)}
 cnt.textContent=`${cur+1} / ${slides.length}`;try{history.replaceState(null,'','#'+(cur+1))}catch(e){}}
function goto(i,s=0){i=Math.max(0,Math.min(slides.length-1,i));if(i!==cur){slides.forEach((x,k)=>x.classList.toggle('on',k===i));if(cur>=0)slides[cur].querySelectorAll('[data-s]').forEach(e=>e.classList.remove('in'));cur=i}step=s;
 requestAnimationFrame(()=>requestAnimationFrame(()=>render()))}
function next(){const n=+slides[cur].dataset.steps||0;if(step<n){step++;render()}else if(cur<slides.length-1)goto(cur+1,0)}
function prev(){if(step>0){step--;render(false)}else if(cur>0)goto(cur-1,+slides[cur-1].dataset.steps||0)}
addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();next()}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev()}else if(e.key==='Home')goto(0);else if(e.key==='End')goto(slides.length-1);else if(e.key==='f'){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}});
document.getElementById('vp').addEventListener('click',()=>next());
document.getElementById('bp').onclick=e=>{e.stopPropagation();prev()};document.getElementById('bn').onclick=e=>{e.stopPropagation();next()};
document.getElementById('bf').onclick=e=>{e.stopPropagation();document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
const h=+(location.hash.match(/^#(\d+)/)||[])[1];goto(h?h-1:0);
window.__deck={goto,next,prev,slides}})();
</script></body></html>
